<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>블라인드 트래킹 테스트 페이지</title>
  
  <!-- PDF 가이드 1번에 명시된 진짜 스크립트 -->
  <script src="https://blindmmp.com/blind.js"
          data-site-id="sb_publishable_taejobstest_864610beb0acb327"
          async></script>
</head>
<body style="text-align: center; padding-top: 50px;">
  <h1>태잡스 광고 테스트</h1>
  <p>아래 버튼을 누르면 블라인드 대시보드로 '신청 완료' 데이터가 전송됩니다.</p>
  
  <button onclick="sendEvent()" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">
    완료하기
  </button>

  <script>
    function sendEvent() {
      if (typeof window.blindTrack === 'function') {
        window.blindTrack('sign_up', { plan: 'free' });
        alert('신청 완료 이벤트(sign_up)가 성공적으로 전송되었습니다!');
      } else {
        alert('blindTrack 스크립트가 아직 로드되지 않았습니다.');
      }
    }
  </script>
</body>
</html>
